<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- theme-color — фикс мигания цвета адресной строки Safari на телефоне
     (см. задание, пункт 4): без явного тега Safari сам угадывает цвет
     адресной строки по пикселям под ней, и из-за анимаций/дима панели
     читалки (.ic-rbar/.ic-rb-sheet/#ic-rb-dim, app.css) этот цвет мог
     дёргаться. #16130f — тот же тон, что у .back-bar (index.html, выше) и
     --bar у .ic-rbar (app.css), т.е. цвет самой шапки/капсулы — адресная
     строка теперь зафиксирована на нём независимо от того, что происходит
     ниже. Никакой JS (app.js) этот тег не трогает динамически — подтверждено
     отдельно (grep на theme-color в app.js пуст), см. отчёт. -->
<meta name="theme-color" content="#16130f">
<title>Library</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#ece5d4}
  .back-bar{
    position:sticky;top:0;z-index:10;height:52px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding-inline:calc(20px + env(safe-area-inset-left)) calc(20px + env(safe-area-inset-right));
    box-sizing:border-box;
    background:#16130f;
    box-shadow:0 8px 24px -14px rgba(0,0,0,.5);
    transition:transform .3s ease, height .2s ease;
  }
  /* Компактная форма при малой высоте экрана (ландшафт телефона — например
     iPhone 13 844x390): без этого шапка+панель читалки (.ic-rbar, app.css)
     вместе отъедают слишком большую долю из 390px высоты. orientation:landscape
     в паре с max-height — десктопных окон (1440x900 и т.п.) не задевает. */
  @media (max-height:500px) and (orientation:landscape){
    .back-bar{height:38px}
    .back-bar a{font-size:17px}
  }
  /* Этот раунд, задание пункт 1: "Andrey Stepin · Библиотека" рядом с
     RU/EN/FR на 390px шире, чем было одно "Andrey Stepin" — без этой
     поджатой формы имя обрезалось многоточием. Те же числа, что у
     ландшафтного брейкпоинта выше, по той же причине (узко). */
  @media (max-width:460px){
    .back-bar{gap:10px;padding-inline:calc(14px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-right))}
    .back-bar-brand a:first-child{font-size:17px}
    #back-bar-lang{gap:10px}
  }
  /* Added by the Cartari chapter reader bar (app.js rbTick): slides this bar
     away together with its own in-chapter nav bar on a scroll down, in sync,
     so the two disappear and come back as one unit. transform only — this
     bar is already position:sticky, so hiding it this way frees screen space
     without reflowing anything underneath. */
  .back-bar.ic-bb-hidden{transform:translateY(-100%)}
  /* .back-bar-fixed/.ic-booktabs-fixed — фикс мигания sticky при жесте по
     рейлу букв указателя/«Имён» (.ic-az-rail) через принудительный
     position:fixed — убран этим раундом вместе с .ic-rbar-tv (см. app.css):
     жест уже троттлится через rAF (wireAzRail), и на обычном sticky с этим
     троттлингом мигание не возвращается (проверено видео-прогоном, см.
     задание), так что указатель/«Имена» теперь везде обычный sticky, как
     читалка главы — класс нигде в app.js больше не навешивается. */
  .back-bar a{
    font-family:"IM Fell English","Iowan Old Style",Georgia,serif;
    font-size:20px;letter-spacing:.02em;
    color:rgba(236,229,212,.86);text-decoration:none;
  }
  .back-bar a:hover{color:#ece5d4}
  .back-bar-brand{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
  .back-bar-brand>a:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* .back-bar-lib (задание этого раунда, пункт 1) — «Библиотека» рядом с
     именем в шапке сайта, вместо отдельной ссылки на обложке книги (той
     же кнопки, что раньше была в .ic-top-row — убрана, см. app.js
     renderHome). Шрифт/размер — НЕ как у "Andrey Stepin" (это имя — 20px
     декоративной антиквой): задание прямо сравнивает её с неактивными
     RU/EN/FR, так что те же font-size/letter-spacing/uppercase, что у
     #back-bar-lang button ниже — и вдобавок решает исходную тесноту (20px
     "Andrey Stepin · Библиотека" целиком не помещалось на 390px рядом с
     RU/EN/FR — обе половины обрезались многоточием). ::before — короткое
     тире-разделитель, без лишнего текстового узла в разметке; заполняется
     (как и #back-bar-lang) из app.js, по языку и только когда есть куда
     вести (не forcedBook — отдельная книга без самой библиотеки). */
  /* .back-bar a.back-bar-lib (не просто .back-bar-lib) — специфичность
     (0,0,2,1) нужна, чтобы перебить ".back-bar a" выше (0,0,1,1, класс+тип):
     тот же класс специфичности, который уже не раз ловился в этом файле —
     без лишнего класса в селекторе здесь побеждал бы font-size:20px общего
     правила для ссылок шапки, а не 13px ниже (проверено: без этого
     уточнения вычисленный font-size оставался 20px несмотря на объявленные
     здесь 13px). */
  .back-bar a.back-bar-lib{
    font-family:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(236,229,212,.6);text-decoration:none;transition:color .2s;
    white-space:nowrap;flex:none;
  }
  .back-bar a.back-bar-lib:hover{color:#ece5d4}
  .back-bar-lib::before{content:"· "}
  /* Filled in by app.js: the RU/EN switch, always in the corner here instead
     of scrolling away with the page content. Выбранное состояние — «вариант
     3» (решение Андрея, round «tabs-selected»): та же плашка, что у
     book-вкладок и языка в читалке (app.css), а не свой отдельный underline. */
  #back-bar-lang{display:flex;gap:4px;flex:none}
  #back-bar-lang button{
    font:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;
    color:rgba(236,229,212,.62);box-shadow:inset 0 0 0 1px transparent;
    transition:background-color .16s ease,box-shadow .16s ease,color .16s ease,transform .15s ease;
  }
  #back-bar-lang button[aria-pressed="true"]{color:rgb(236,229,212);background:rgba(236,229,212,.14);box-shadow:inset 0 0 0 1px rgba(236,229,212,.28)}
  #back-bar-lang button:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="back-bar"><span class="back-bar-brand"><a href="https://94hours.com/projects/">Andrey Stepin</a></span><span id="back-bar-lang"></span></div>
<div id="iconologie" data-book="library" data-top="52px"></div>
<script src="app.js?v=154"></script>
</body>
</html>
