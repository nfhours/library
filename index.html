<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- theme-color — фикс мигания цвета адресной строки Safari на телефоне
     (см. задание, пункт 4): без явного тега Safari сам угадывает цвет
     адресной строки по пикселям под ней, и из-за анимаций/дима панели
     читалки (.ic-rbar/.ic-rb-sheet/#ic-rb-dim, app.css) этот цвет мог
     дёргаться. #16130f — тот же тон, что у .back-bar (index.html, выше) и
     --bar у .ic-rbar (app.css), т.е. цвет самой шапки/капсулы — адресная
     строка теперь зафиксирована на нём независимо от того, что происходит
     ниже. Никакой JS (app.js) этот тег не трогает динамически — подтверждено
     отдельно (grep на theme-color в app.js пуст), см. отчёт. -->
<meta name="theme-color" content="#16130f">
<title>Library</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#ece5d4}
  .back-bar{
    position:sticky;top:0;z-index:10;height:52px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding-inline:calc(20px + env(safe-area-inset-left)) calc(20px + env(safe-area-inset-right));
    box-sizing:border-box;
    background:#16130f;
    box-shadow:0 8px 24px -14px rgba(0,0,0,.5);
    transition:transform .3s ease, height .2s ease;
  }
  /* Компактная форма при малой высоте экрана (ландшафт телефона — например
     iPhone 13 844x390): без этого шапка+панель читалки (.ic-rbar, app.css)
     вместе отъедают слишком большую долю из 390px высоты. orientation:landscape
     в паре с max-height — десктопных окон (1440x900 и т.п.) не задевает. */
  @media (max-height:500px) and (orientation:landscape){
    .back-bar{height:38px}
    .back-bar a{font-size:17px}
  }
  /* Added by the Cartari chapter reader bar (app.js rbTick): slides this bar
     away together with its own in-chapter nav bar on a scroll down, in sync,
     so the two disappear and come back as one unit. transform only — this
     bar is already position:sticky, so hiding it this way frees screen space
     without reflowing anything underneath. */
  .back-bar.ic-bb-hidden{transform:translateY(-100%)}
  /* .back-bar-fixed — переключается app.js (route(), на входе/выходе с
     указателя/«Имён») ТОЛЬКО на время, пока текущий маршрут #/cartari/index
     или #/cartari/names: там жест по рейлу букв (.ic-az-rail, app.js) дёргает
     window.scrollTo на каждый pointermove, а position:sticky у этой шапки
     известно перерисовывается (пересчитывает композитный слой) в iOS Safari
     от частых программных скроллов — шапка на долю кадра визуально пропадает
     целиком. position:fixed с отдельным слоем композиции не пересчитывается
     так же. left:0;right:0 — она и раньше была на всю ширину вьюпорта (эта
     шапка не вложена в max-width-обёртку, в отличие от .ic-rbar-tv, app.css),
     так что разницы в раскладке нет вовсе, ни на одной ширине экрана. На всех
     ОСТАЛЬНЫХ страницах (библиотека, главная книги, читалка) класс не
     добавляется — там шапка остаётся обычной sticky, без регрессии (там либо
     нет частых программных scrollTo за время жеста, либо — читалка — см.
     пункт 3 задания/отчёт: баг не воспроизведён при разумной имитации). */
  .back-bar.back-bar-fixed{position:fixed;left:0;right:0;
    transform:translateZ(0);will-change:transform;backface-visibility:hidden}
  .back-bar a{
    font-family:"IM Fell English","Iowan Old Style",Georgia,serif;
    font-size:20px;letter-spacing:.02em;
    color:rgba(236,229,212,.86);text-decoration:none;
  }
  .back-bar a:hover{color:#ece5d4}
  /* Filled in by app.js: the RU/EN switch, always in the corner here instead
     of scrolling away with the page content. */
  #back-bar-lang{display:flex;gap:16px;flex:none}
  #back-bar-lang button{
    font:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:0;padding:4px 0;cursor:pointer;
    color:rgba(236,229,212,.6);box-shadow:inset 0 -1px 0 transparent;
    transition:box-shadow .2s,color .2s;
  }
  #back-bar-lang button[aria-pressed="true"]{color:#ece5d4;box-shadow:inset 0 -1px 0 #8e2b1d}
</style>
</head>
<body>
<div class="back-bar"><a href="https://94hours.com/projects/">Andrey Stepin</a><span id="back-bar-lang"></span></div>
<div id="iconologie" data-book="library" data-top="52px"></div>
<script src="app.js?v=123"></script>
</body>
</html>
